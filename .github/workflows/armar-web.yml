# Cuando alguien guarda cambios desde el panel (/admin), se tocan los archivos de content/.
# Esto vuelve a armar las páginas con _build.py y las sube; Cloudflare Pages publica solo.
name: Armar la web

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'img/subidas/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: armar-web
  cancel-in-progress: false

jobs:
  armar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Armar páginas
        run: python3 _build.py
      - name: Subir las páginas armadas
        run: |
          git config user.name "byluly-panel"
          git config user.email "byluly-panel@users.noreply.github.com"
          git add -A index.html branding.html redes-sociales.html contacto.html portafolio.html
          if git diff --cached --quiet; then
            echo "Sin cambios en las páginas"
          else
            git commit -m "Panel: vuelve a armar las páginas"
            git pull --rebase
            git push
          fi
