    - name: packs
      label: Packs
      widget: object
      fields:
      - name: core
        label: THE CORE
        widget: object
        collapsed: true
        fields:
        - name: categoria
          label: Categoría (texto chico arriba)
          widget: string
          required: true
        - name: nombre
          label: Nombre del pack
          widget: string
          required: true
        - name: duracion
          label: Duración
          widget: string
          required: true
        - name: descripcion
          label: Descripción
          widget: text
          hint: 'Para poner en negrita, escribí el texto entre dos asteriscos: **así**. Cada Enter es un salto de línea.'
        - name: boton
          label: Texto del botón
          widget: string
          required: true
        - &id001
          name: detalle
          label: Qué incluye (ventana de "VER QUE INCLUYE")
          widget: object
          collapsed: true
          fields:
          - name: duracion
            label: Duración que se muestra en la ventana
            widget: string
            required: true
          - name: secciones
            label: Secciones
            widget: list
            required: false
            fields:
            - name: titulo
              label: Título de la sección
              widget: string
              required: true
            - name: items
              label: Ítems
              widget: list
              field:
                name: item
                label: Ítem
                widget: string
          - name: extras
            label: Extras (regalos, archivos, etc.)
            widget: list
            field:
              name: item
              label: Ítem
              widget: string
            required: false
          - name: opciones
            label: Opciones con precio propio (solo THE SPACE)
            widget: list
            required: false
            hint: Si el pack tiene opciones (Landing, Web, Tienda) se muestran en lugar de las secciones.
            fields:
            - name: nombre
              label: Nombre
              widget: string
              required: true
            - name: ideal_para
              label: Ideal para
              widget: string
              required: true
            - name: items
              label: Ítems
              widget: list
              field:
                name: item
                label: Ítem
                widget: string
            - name: precio
              label: Precio
              widget: string
              hint: 'Ej: 600 USD'
              required: false
          - name: semanas
            label: Proceso (semanas)
            widget: list
            fields:
            - name: titulo
              label: Título
              widget: string
              required: true
            - name: items
              label: Ítems
              widget: list
              field:
                name: item
                label: Ítem
                widget: string
            - name: llamada
              label: ¿Incluye llamada de presentación?
              widget: boolean
              default: false
          - name: precio
            label: Precio total
            widget: string
            hint: 'Ej: Inversión: 350 USD. Dejalo vacío para no mostrarlo.'
            required: false
      - name: object
        label: THE OBJECT
        widget: object
        collapsed: true
        fields:
        - name: categoria
          label: Categoría (texto chico arriba)
          widget: string
          required: true
        - name: nombre
          label: Nombre del pack
          widget: string
          required: true
        - name: duracion
          label: Duración
          widget: string
          required: true
        - name: descripcion
          label: Descripción
          widget: text
          hint: 'Para poner en negrita, escribí el texto entre dos asteriscos: **así**. Cada Enter es un salto de línea.'
        - name: boton
          label: Texto del botón
          widget: string
          required: true
        - name: foto
          label: Foto del pack
          widget: image
        - *id001
      - name: voice
