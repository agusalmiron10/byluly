  - name: portafolio
    label: Portafolio
    file: content/portafolio.json
    fields:
    - name: proyectos
      label: Proyectos
      label_singular: proyecto
      widget: list
      summary: '{{fields.nombre}} — {{fields.rubro}}'
      hint: Arrastrá los proyectos para cambiar el orden en que aparecen.
      fields:
      - name: nombre
        label: Nombre de la marca
        widget: string
        required: true
      - name: rubro
        label: Rubro (texto en mayúsculas debajo del nombre)
        widget: string
        required: true
      - name: categorias
        label: Filtros donde aparece
        widget: select
        multiple: true
        options:
        - label: Identidad de marca
          value: branding
        - label: Packaging
          value: packaging
        - label: Redes
          value: redes
      - name: descripcion
        label: Descripción
        widget: text
      - name: texto_alternativo
        label: Descripción de la foto (para buscadores y lectores de pantalla)
        widget: string
        required: false
      - name: fotos
        label: Fotos
        label_singular: foto
        widget: list
        hint: La primera es la portada del proyecto.
        field:
          name: foto
          label: Foto
          widget: image
  - name: contacto
    label: Contacto ("Hola, soy luly")
    file: content/contacto.json
    fields:
    - name: sobre_mi
      label: Sobre mí
      widget: object
      collapsed: true
      fields:
      - name: texto
        label: Texto
        widget: text
        hint: Dejá una línea en blanco para empezar un párrafo nuevo. **negrita** entre dos asteriscos.
      - name: foto
        label: Foto
        widget: image
  - name: general
    label: Datos generales (WhatsApp, redes, aviso, popup…)
    file: content/general.json
    fields:
    - name: contacto
      label: WhatsApp, mail y redes
      widget: object
      collapsed: true
      fields:
      - name: whatsapp_numero
        label: Número de WhatsApp
        widget: string
        hint: 'Con código de país y sin espacios ni +. Ej: 5491160169886'
      - name: whatsapp_visible
        label: Número como se muestra
        widget: string
        hint: 'Ej: +54 9 11 6016-9886'
      - name: whatsapp_mensaje
        label: Mensaje que aparece escrito al abrir WhatsApp
        widget: string
      - name: email
        label: Mail
        widget: string
      - name: instagram
        label: Link de Instagram
        widget: string
      - name: tiktok
        label: Link de TikTok
        widget: string
      - name: pinterest
        label: Link de Pinterest
        widget: string
    - name: aviso
      label: Aviso arriba de todo (promociones)
      widget: object
      collapsed: true
      fields:
      - name: activo
        label: Mostrar el aviso
        widget: boolean
        default: false
      - name: texto
        label: Texto del aviso
        widget: string
      - name: link
        label: Link al tocarlo (opcional)
        widget: string
        hint: 'Ej: https://wa.me/5491160169886 o contacto.html'
        required: false
      hint: Una franja bordó arriba del menú, en todas las páginas.
    - name: cinta
      label: Cinta que se desliza
      widget: object
      collapsed: true
      fields:
      - name: palabras
        label: Palabras
        widget: list
        field:
          name: item
          label: Ítem
          widget: string
        hint: Se repiten con una estrellita ✦ entre cada una.
    - name: hablemos
      label: '"Hablemos!" (al final de las páginas)'
      widget: object
      collapsed: true
      fields:
      - name: titulo
        label: Título
        widget: string
      - name: texto
        label: Texto
        widget: text
      - name: pasos
        label: Pasos
        widget: list
        field:
          name: item
          label: Ítem
          widget: string
        hint: Se numeran solos (1, 2, 3...).
    - name: popup
      label: Popup de la plantilla gratis (Home)
      widget: object
      collapsed: true
      fields:
      - name: activo
        label: Mostrar el popup
        widget: boolean
        default: true
      - name: titulo
        label: Título
        widget: text
        hint: Cada Enter es un salto de línea.
      - name: texto
        label: Texto
        widget: text
      - name: recursos
        label: Recursos que se pueden pedir
        widget: list
        field:
          name: item
          label: Ítem
          widget: string
