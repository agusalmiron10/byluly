# Panel de contenido (Decap CMS). Se entra por https://byluly.pages.dev/admin con la contraseña del panel
backend:
  name: github
  repo: agusalmiron10/byluly
  branch: main
  base_url: https://byluly.pages.dev
  auth_endpoint: api/auth
  commit_messages:
    update: 'Panel: actualiza {{slug}}'
    uploadMedia: 'Panel: sube {{path}}'
    create: 'Panel: crea {{slug}}'
    delete: 'Panel: borra {{slug}}'
    deleteMedia: 'Panel: borra {{path}}'
locale: es
site_url: https://byluly.pages.dev
display_url: https://byluly.pages.dev
logo_url: /img/logo-byluly.png
media_folder: img/subidas
public_folder: /img/subidas
collections:
- name: contenido
  label: Contenido de la web
  editor:
    preview: false
  files:
  - name: home
    label: Home
    file: content/home.json
    fields:
    - name: inicio
      label: Principio de la página
      widget: object
      collapsed: true
      fields:
      - name: titulo_1
        label: Título grande (primera parte)
        widget: string
      - name: titulo_2
        label: Título grande (después del &)
        widget: string
      - name: texto
        label: Texto
        widget: text
        hint: '**negrita** entre dos asteriscos, *cursiva* entre uno. Cada Enter es un salto de línea.'
      - name: boton
        label: Texto del botón
        widget: string
      - name: foto
        label: Foto de Luly
        widget: image
      - name: etiqueta_foto
        label: Etiqueta sobre la foto
        widget: string
    - name: identidad
      label: Bloque "Identidad de marca"
      widget: object
      collapsed: true
      fields:
      - name: categoria
        label: Texto chico arriba
        widget: string
      - name: titulo
        label: Título
        widget: text
        hint: '*cursiva* entre un asterisco (la parte en itálica). Cada Enter es un salto de línea.'
      - name: texto
        label: Texto
        widget: text
        hint: '**negrita** entre dos asteriscos, *cursiva* entre uno. Cada Enter es un salto de línea.'
      - name: boton
        label: Texto del botón
        widget: string
    - name: redes
      label: Bloque "Redes Sociales"
      widget: object
      collapsed: true
      fields:
      - name: categoria
        label: Texto chico arriba
        widget: string
      - name: titulo
        label: Título
        widget: text
        hint: '*cursiva* entre un asterisco (la parte en itálica). Cada Enter es un salto de línea.'
      - name: texto
        label: Texto
        widget: text
        hint: Dejá una línea en blanco para empezar un párrafo nuevo. **negrita** entre dos asteriscos.
      - name: boton
        label: Texto del botón
        widget: string
      - name: foto
        label: Foto
        widget: image
    - name: numeros
      label: Números que suben solos
      label_singular: número
      widget: list
      summary: +{{fields.numero}} {{fields.etiqueta}}
      fields:
      - name: numero
        label: Número
        widget: number
        value_type: int
        min: 0
      - name: etiqueta
        label: 'Texto debajo (ej: marcas)'
        widget: string
    - name: testimonios
      label: Testimonios ("Lo que dicen mis clientes")
      widget: object
      collapsed: true
      fields:
      - name: titulo
        label: Título
        widget: text
        hint: Cada Enter es un salto de línea.
      - name: mensajes
        label: Mensajes
        label_singular: mensaje
        widget: list
        summary: '{{fields.nombre}} {{fields.texto}}'
        hint: Se acomodan solos en tres columnas, en este orden. Arrastralos para reordenarlos.
        fields:
        - name: nombre
          label: Nombre (opcional)
          widget: string
          required: false
        - name: color
          label: Color del nombre
          widget: color
          required: false
          default: '#770523'
        - name: texto
          label: Mensaje
          widget: text
          hint: '**negrita** entre dos asteriscos, *cursiva* entre uno. Cada Enter es un salto de línea.'
        - name: hora
          label: 'Hora (opcional, ej: 18:49)'
          widget: string
          required: false
        - name: nombre_en_el_texto
          label: ¿El nombre va pegado al mensaje? (como una mención)
          widget: boolean
          default: false
          required: false
    - name: proyectos
      label: '"Proyectos que realizamos en mi Agencia creativa"'
      widget: object
      collapsed: true
      fields:
      - name: titulo
        label: Título
        widget: text
        hint: '*cursiva* entre un asterisco (la parte en itálica). Cada Enter es un salto de línea.'
      - name: texto
        label: Texto
        widget: text
        hint: '**negrita** entre dos asteriscos, *cursiva* entre uno. Cada Enter es un salto de línea.'
    - name: marcas
      label: Lista de marcas (foto al pasar el mouse)
      widget: object
      collapsed: true
      fields:
      - name: titulo
        label: Título
        widget: string
      - name: lista
        label: Marcas
        label_singular: marca
        widget: list
        summary: '{{fields.nombre}}'
        fields:
        - name: nombre
          label: Nombre
          widget: string
        - name: rubro
          label: Rubro
          widget: string
        - name: foto
          label: Foto
          widget: image
