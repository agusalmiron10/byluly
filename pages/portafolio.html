<main id="top">

<section class="page-hero">
  <p class="page-hero__kicker">Trabajos</p>
  <h1 class="page-hero__title">My Portfolio</h1>
  <p class="page-hero__sub">Bienvenida a mi portafolio. Acá vas a encontrar el estilo gráfico que me define. Chusmeá todo lo que quieras y descubrí cómo podemos trabajar juntas para darle vida a tus ideas.</p>
</section>

<section class="gallery-page">
  <div class="filtros" role="group" aria-label="Filtrar trabajos">
    <button class="filtros__btn is-active" type="button" data-filtro="todo" aria-pressed="true">Todo</button>
    <button class="filtros__btn" type="button" data-filtro="branding" aria-pressed="false">Identidad de marca</button>
    <button class="filtros__btn" type="button" data-filtro="packaging" aria-pressed="false">Packaging</button>
    <button class="filtros__btn" type="button" data-filtro="redes" aria-pressed="false">Redes</button>
  </div>
  <div class="gallery">
{{portafolio_items}}
  </div>
</section>

<section class="cta-band">
  <h2 class="display reveal">¿Te gusta lo que ves?</h2>
  <a href="contacto.html" class="btn btn--pistacho reveal">Trabajemos juntas</a>
</section>

</main>
