<main id="top">

<section class="about">
  <div class="about__body">
    <div class="about__text reveal">
      <h1 class="about__hello"><img class="about__flower" src="img/contacto-flower.png" alt="" width="140" height="135">Hola, soy <img class="about__luly" src="img/contacto-luly.png" alt="luly" width="460" height="282"></h1>
      {{p:contacto.sobre_mi.texto}}
    </div>
    <div class="about__media reveal">
      <img src="{{a:contacto.sobre_mi.foto}}" alt="Luly, diseñadora gráfica de Studio Byluly, sentada con su notebook y celular" width="820" height="1109">
      <img class="about__pin" src="img/contacto-pin.png" alt="" width="260" height="544">
      <img class="about__sparkles" src="img/contacto-sparkles.png" alt="" width="180" height="198">
    </div>
  </div>
</section>

<section class="hablemos hablemos--light" id="hablemos">
  <div class="hablemos__badge hablemos__badge--light" aria-hidden="true">
    <img class="hablemos__badge-ring" src="img/badge-peony-ring.png" alt="" width="290" height="287" loading="lazy">
    <img class="hablemos__badge-logo" src="img/badge-logo.png" alt="" width="270" height="152" loading="lazy">
  </div>
  <h2 class="hablemos__title hablemos__title--light">{{c:general.hablemos.titulo}}</h2>
  <p class="hablemos__lead hablemos__lead--center">{{c:general.hablemos.texto}}</p>
  <ol class="pasos pasos--center">
{{pasos_items}}
  </ol>

  <form class="form-contacto form-contacto--light" id="formContacto" novalidate>
    <div class="form-contacto__row">
      <label class="field field--light"><span>Nombre</span><input type="text" name="nombre" required></label>
      <label class="field field--light"><span>Apellido</span><input type="text" name="apellido"></label>
    </div>
    <div class="form-contacto__row">
      <label class="field field--light"><span>País</span><input type="text" name="pais"></label>
      <label class="field field--light"><span>Ciudad</span><input type="text" name="ciudad"></label>
    </div>
    <div class="form-contacto__row">
      <label class="field field--light"><span>Celular</span><input type="tel" name="tel"></label>
      <label class="field field--light"><span>Email</span><input type="email" name="email" required></label>
    </div>
    <div class="form-contacto__row">
      <label class="field field--light"><span>¿Qué negocio tenés? Adjuntá tu Instagram o web</span><input type="text" name="negocio"></label>
      <label class="field field--light">
        <span>¿Cuál es tu presupuesto para este proyecto?</span>
        <select name="presupuesto">
          <option value="">Elegí una opción</option>
          <option>Menos de 500 USD</option>
          <option>500 - 1.000 USD</option>
          <option>1.000 - 2.000 USD</option>
          <option>Más de 2.000 USD</option>
          <option>Prefiero contarte por WhatsApp</option>
        </select>
      </label>
    </div>
    <label class="field field--light field--full"><span>Cuéntanos más sobre tu proyecto o marca</span><textarea name="mensaje" rows="3"></textarea></label>

    <p class="form-contacto__privacy">Al enviar este formulario, aceptás que almacenemos tus datos para gestionar tu consulta. Consultá nuestra <b>Política de privacidad.</b></p>

    <button type="submit" class="btn btn--cream">Trabajemos juntos</button>
    <p class="form-msg" id="formContactoMsg" role="status"></p>
  </form>
</section>

<div class="tira" id="tira">
  <div class="tira__track" id="tiraTrack">
    <img src="img/mk-regalo.jpg" alt="Pieza de marca — el regalo que sigue sorprendiendo" loading="lazy">
    <img src="img/mk-eleva.jpg" alt="Packaging Eleva" loading="lazy">
    <img src="img/mk-greta.jpg" alt="Branding grETa coffee spot" loading="lazy">
    <img src="img/mk-vigno.jpg" alt="Tote bag Vigno Bar" loading="lazy">
    <img src="img/mk-viveliviano.jpg" alt="Papelería Vive Liviano" loading="lazy">
  </div>
</div>

</main>
