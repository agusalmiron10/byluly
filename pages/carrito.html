<main id="top">

<section class="page-hero page-hero--short">
  <p class="page-hero__kicker">Tienda</p>
  <h1 class="page-hero__title">Tu carrito</h1>
</section>

<section class="cart-page">
  <div class="cart-page__inner reveal">
    <ul class="cart-list" id="cartList"></ul>
    <p class="cart-empty" id="cartEmpty">Todavía no agregaste nada.</p>
    <div class="cart-total" id="cartTotal" hidden>
      <span>Total</span><strong id="cartTotalValue">$ 0,00</strong>
    </div>
    <div class="cart-actions">
      <a href="tienda.html" class="btn btn--fuchsia">Seguir comprando</a>
      <button class="btn btn--pistachio" id="checkout" hidden>Finalizar compra</button>
    </div>
    <p class="products__note">El checkout todavía no está conectado a ninguna pasarela de pago.</p>
  </div>
</section>

</main>
