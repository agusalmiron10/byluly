<div class="lightbox" id="lightbox" hidden>
  <div class="lightbox__box" role="dialog" aria-modal="true" aria-labelledby="lbTitle">
    <button class="lightbox__close" id="lbClose" aria-label="Cerrar">&times;</button>
    <h3 class="lightbox__title" id="lbTitle">Descarga la plantilla<br>que mas necesites</h3>
    <p class="lightbox__sub">Ingresa tu email y selecciona el recurso gratuito que necesitas y en unos dias te lo mandamos</p>
    <form class="lightbox__form" id="lbForm">
      <label class="lightbox__row">
        <span>Email</span>
        <input type="email" name="email" required>
      </label>
      <label class="lightbox__row">
        <span>Recurso</span>
        <select name="recurso" required>
          <option value="" disabled selected hidden></option>
          <option>Calendario de contenido</option>
          <option>Agenda del día</option>
          <option>Agenda semanal</option>
          <option>Checklist de branding</option>
        </select>
      </label>
      <button type="submit" class="btn btn--fuchsia lightbox__submit">Enviar</button>
    </form>
  </div>
</div>
