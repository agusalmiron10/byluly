<div class="lightbox" id="lightbox" hidden>
  <div class="lightbox__frame" role="dialog" aria-modal="true" aria-labelledby="lbTitle">
  <div class="lightbox__box">
    <button class="lightbox__close" id="lbClose" aria-label="Cerrar">&times;</button>
    <h3 class="lightbox__title" id="lbTitle">{{c:general.popup.titulo}}</h3>
    <p class="lightbox__sub">{{c:general.popup.texto}}</p>
    <form class="lightbox__form" id="lbForm">
      <label class="lightbox__row">
        <span>Email</span>
        <input type="email" name="email" required>
      </label>
      <label class="lightbox__row">
        <span>Recurso</span>
        <select name="recurso" required>
          <option value="" disabled selected hidden></option>
{{opciones:general.popup.recursos}}
        </select>
      </label>
      <button type="submit" class="btn btn--fuchsia lightbox__submit">Enviar</button>
    </form>
  </div>
  </div>
</div>
