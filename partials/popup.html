<div class="lightbox" id="lightbox" hidden>
  <div class="lightbox__box" role="dialog" aria-modal="true" aria-labelledby="lbTitle">
    <button class="lightbox__close" id="lbClose" aria-label="Cerrar">&times;</button>
    <p class="lightbox__kicker">DESCARGA LA PLANTILLA</p>
    <h3 class="lightbox__title" id="lbTitle">CALENDARIO DE CONTENIDO</h3>
    <p class="lightbox__sub">Ingresa tu correo y te envio el recurso<br>en unos dias</p>
    <form class="lightbox__form" id="lbForm">
      <input type="email" placeholder=" " aria-label="Tu email" required>
      <button type="submit">Enviar</button>
    </form>
  </div>
</div>
