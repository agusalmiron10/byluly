<section class="hablemos" id="hablemos">
  <div class="hablemos__badge" aria-hidden="true">
    <img class="hablemos__badge-ring" src="img/badge-ring.png" alt="" width="620" height="620" loading="lazy">
    <img class="hablemos__badge-logo" src="img/badge-logo.png" alt="" width="270" height="152" loading="lazy">
  </div>
  <h2 class="hablemos__title">{{c:general.hablemos.titulo}}</h2>

  <div class="hablemos__grid">
    <div class="hablemos__left">
      <p class="hablemos__lead">{{c:general.hablemos.texto}}</p>
      <ol class="pasos">
{{pasos_items}}
      </ol>
      <a class="btn btn--wpp" href="{{wpp_url}}" target="_blank" rel="noopener">{{ico_whatsapp}} {{c:general.botones.whatsapp}}</a>
      <p class="hablemos__or">{{c:general.botones.dejame}}</p>
    </div>

    <form class="form-contacto" id="formContacto" novalidate>
      <label class="field"><span>{{c:general.formulario.nombre}}</span><input type="text" name="nombre" required></label>
      <label class="field"><span>{{c:general.formulario.pais}}</span><input type="text" name="pais"></label>
      <label class="field"><span>{{c:general.formulario.email}}</span><input type="email" name="email" required></label>
      <label class="field"><span>{{c:general.formulario.celular}}</span><input type="tel" name="tel"></label>
      <label class="field"><span>{{c:general.formulario.negocio}}</span><input type="text" name="negocio"></label>

      <fieldset class="checks">
        <legend>{{c:general.formulario.servicio}}</legend>
{{servicios_items}}
      </fieldset>

      <button type="submit" class="btn btn--pistacho">{{c:general.formulario.boton_hablemos}}</button>
      <p class="form-msg" id="formContactoMsg" role="status"></p>
    </form>
  </div>
</section>
